name: Aivance CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Nightly full test suite run at 06:00 UTC Monday-Friday
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (alpha, beta, rc, stable)'
        required: false
        default: 'alpha'
      run_benchmarks:
        description: 'Run performance benchmarks'
        type: boolean
        default: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"
  GRADLE_BUILD_CACHE_ENABLED: true
  JAVA_VERSION: "17"

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Category 1: Security Verification Gate ────────────────
  security-scan:
    name: 🔒 1. Security & Certificate Pinning Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Python verification dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages cryptography

      - name: Run security verification harness
        run: python3 security_scan.py

  # ── Category 2: Categorized Compilation Check ─────────────
  compilation:
    name: ⚙️ 2. Categorized Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Compile All Modules
        run: ./gradlew compileDebugKotlin --no-daemon --parallel

  # ── Category 3: Categorized Unit Test Suite ──────────────
  unit-tests:
    name: 🧪 3. Unit Tests (${{ matrix.category }}: ${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Core Architecture Modules
          - category: 'Core'
            module: ':core:common'
          - category: 'Core'
            module: ':core:database'
          - category: 'Core'
            module: ':core:datastore'
          - category: 'Core'
            module: ':core:designsystem'
          - category: 'Core'
            module: ':core:network'
          - category: 'Core'
            module: ':core:util'
          - category: 'Core'
            module: ':core:domain'
          - category: 'Core'
            module: ':core:data'

          # Provider Integration Engines
          - category: 'Providers'
            module: ':core:sdk'
          - category: 'Providers'
            module: ':core:ai-providers'
          - category: 'Providers'
            module: ':core:job-providers'
          - category: 'Providers'
            module: ':core:enrichment-providers'

          # Feature Modules
          - category: 'Feature'
            module: ':feature:analytics'
          - category: 'Feature'
            module: ':feature:assistant'
          - category: 'Feature'
            module: ':feature:ats'
          - category: 'Feature'
            module: ':feature:coverletter'
          - category: 'Feature'
            module: ':feature:dashboard'
          - category: 'Feature'
            module: ':feature:interview'
          - category: 'Feature'
            module: ':feature:jobs'
          - category: 'Feature'
            module: ':feature:profile'
          - category: 'Feature'
            module: ':feature:recruiter'
          - category: 'Feature'
            module: ':feature:resume'
          - category: 'Feature'
            module: ':feature:tracker'

          # Navigation & App Shell
          - category: 'AppShell'
            module: ':navigation'
          - category: 'AppShell'
            module: ':app'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.module }}:testDebugUnitTest --no-daemon --continue

      - name: Sanitize module name for artifact
        id: sanitize
        run: echo "name=${{ matrix.module }}" | sed 's/:/_/g' | sed 's/^_//' >> $GITHUB_OUTPUT

      - name: Upload test results for ${{ matrix.module }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.sanitize.outputs.name }}
          path: |
            ${{ matrix.module }}/build/reports/tests/
            ${{ matrix.module }}/build/test-results/
          retention-days: 7

  # ── Category 4: Android Lint & Quality Gate ───────────────
  code-quality:
    name: 🧹 4. Code Quality & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android Lint across all modules
        run: ./gradlew lint --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.sarif
          retention-days: 14

  # ── Category 5: APK & Bundle Build Gate ───────────────────
  build-artifacts:
    name: 📦 5. Categorized APK & Bundle Build
    needs: [security-scan, compilation, unit-tests, code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Check Keystore Configuration
        id: check-keystore
        run: |
          if [ -n "${{ secrets.AIVANCE_KEYSTORE_BASE64 }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "${{ secrets.AIVANCE_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK & Bundle
        run: |
          if [ "${{ steps.check-keystore.outputs.exists }}" == "true" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          else
            echo "Keystore secret not present — compiling debug binaries"
            ./gradlew :app:assembleDebug --no-daemon
          fi
        env:
          AIVANCE_STORE_PASSWORD: ${{ secrets.AIVANCE_STORE_PASSWORD }}
          AIVANCE_KEY_ALIAS: ${{ secrets.AIVANCE_KEY_ALIAS }}
          AIVANCE_KEY_PASSWORD: ${{ secrets.AIVANCE_KEY_PASSWORD }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.check-keystore.outputs.exists == 'true'
        with:
          name: aivance-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: steps.check-keystore.outputs.exists == 'true'
        with:
          name: aivance-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
